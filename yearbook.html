<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIANCAvenue Vol. 23 📸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .yearbook-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--cream) 0%, var(--pink) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      overflow: hidden;
    }

    .yearbook-header {
      text-align: center;
      margin-bottom: 40px;
      z-index: 1;
    }

    .yearbook-label {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .yearbook-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .yearbook-subtitle {
      font-size: 0.95rem;
      color: var(--text-mid);
      font-weight: 300;
    }

    /* The yearbook image frame */
    .yearbook-frame {
      z-index: 1;
      position: relative;
      max-width: 520px;
      width: 90%;
      animation: revealBook 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes revealBook {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .yearbook-frame::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--green), var(--pink));
      z-index: -1;
      filter: blur(20px);
      opacity: 0.6;
    }

    .yearbook-image {
      width: 100%;
      display: block;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(58, 46, 53, 0.25);
      border: 6px solid var(--white);
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      font-size: 1.6rem;
      animation: floatSparkle 4s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .sparkle:nth-child(1) { top: 8%;  left: 8%;  animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 12%; right: 10%; animation-delay: 1s; }
    .sparkle:nth-child(3) { bottom: 15%; left: 6%;  animation-delay: 2s; }
    .sparkle:nth-child(4) { bottom: 10%; right: 8%; animation-delay: 0.5s; }

    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      50%       { transform: translateY(-14px) rotate(20deg); opacity: 1; }
    }

    .yearbook-footer {
      margin-top: 32px;
      text-align: center;
      z-index: 1;
    }

    .yearbook-footer p {
      font-size: 0.85rem;
      color: var(--text-mid);
      font-weight: 300;
      font-style: italic;
    }

    .btn-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 36px;
      z-index: 1;
    }

    .next-btn {
      padding: 16px 36px;
      background: linear-gradient(135deg, var(--green), #7ab55a);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
      box-shadow: 0 6px 24px rgba(147, 197, 114, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      z-index: 1;
      text-decoration: none;
      display: inline-block;
    }

    .next-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 36px rgba(147, 197, 114, 0.65);
    }

    .next-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .visit-btn {
      padding: 16px 36px;
      background: linear-gradient(135deg, var(--pink), #f7c5d0);
      border: 2px solid var(--green);
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      letter-spacing: 0.04em;
      box-shadow: 0 6px 24px rgba(255, 233, 239, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
      z-index: 1;
    }

    .visit-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 36px rgba(255, 197, 208, 0.7);
    }

    .visit-btn:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>
  <div class="yearbook-page">

    <!-- Background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Floating sparkles -->
    <span class="sparkle">✨</span>
    <span class="sparkle">🌸</span>
    <span class="sparkle">💫</span>
    <span class="sparkle">🎀</span>

    <!-- Header -->
    <div class="yearbook-header">
      <p class="yearbook-label">🎉 Your surprise awaits</p>
      <h1 class="yearbook-title">The Yearbook</h1>
      <p class="yearbook-subtitle">Your life, through my eyes.</p>
    </div>

    <!-- Single Yearbook Image -->
    <div class="yearbook-frame">
      <img
        src="yearbook.jpg"
        alt="BIANCAvenue Vol. 23 — End of Age Edition"
        class="yearbook-image"
      />
    </div>

    <!-- Footer note -->
    <div class="yearbook-footer">
      <p>Vol. 23 · End of Age Edition · Made with 💚</p>
    </div>

    <!-- Button row -->
    <div class="btn-row">
      <a href="https://drive.google.com/file/d/1LGEdnSXuCDNOIltFK_ye0uU0SjT02D5m/view?usp=sharing" target="_blank" class="visit-btn" id="visitBtn">Visit 23 ✨</a>
      <a href="video.html" class="next-btn" id="nextBtn">On to the next one →</a>
    </div>

  </div>
</body>
</html>
