<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spin to Win 🎉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">

    <!-- Decorative floating blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="hero-header">
      <p class="hero-subtitle">✨ You've been chosen ✨</p>
      <h1 class="hero-title">Spin Your Fate</h1>
      <p class="hero-desc">Give the wheel a spin to reveal your surprise gift 🎁</p>
    </header>

    <main class="wheel-section">
      <!-- Pointer -->
      <div class="pointer-wrap">
        <div class="pointer"></div>
      </div>

      <!-- Wheel Canvas -->
      <div class="wheel-container">
        <canvas id="wheelCanvas" width="420" height="420"></canvas>
      </div>

      <!-- Spin Button -->
      <button id="spinBtn" class="spin-btn">
        <span class="spin-btn-text">Spin 🎡</span>
      </button>

      <p id="spinNote" class="spin-note">You only get one spin — make it count!</p>
    </main>

    <!-- Result Overlay -->
    <div id="resultOverlay" class="result-overlay hidden">
      <div class="result-card">
        <div class="result-emoji">🎉</div>
        <h2 class="result-title">You got:</h2>
        <p id="resultText" class="result-prize"></p>
        <p class="result-sub">Redirecting you to your surprise...</p>
        <div class="loader-bar"><div class="loader-fill"></div></div>
      </div>
    </div>

  </div>

  <script src="wheel.js"></script>
</body>
</html>
