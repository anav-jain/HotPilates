<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFE9EF 0%, #ffd6e4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 52px;
      z-index: 1;
    }

    .gallery-label {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
      font-weight: 600;
      margin-bottom: 10px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }

    .gallery-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .gallery-subtitle {
      font-size: 0.95rem;
      color: var(--text-mid);
      font-weight: 300;
    }

    /* Gallery list */
    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 680px;
      width: 100%;
      z-index: 1;
    }

    .gallery-item {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(58, 46, 53, 0.18);
      border: 5px solid #fff;
      background: #fff;
      cursor: pointer;
      animation: fadeUp 0.6s ease both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(58, 46, 53, 0.28);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .gallery-item img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 25, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      border: 5px solid #fff;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: transform 0.2s;
    }

    .lightbox-close:hover {
      transform: scale(1.2) rotate(10deg);
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      font-size: 1.6rem;
      animation: floatSparkle 4s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .sparkle:nth-child(1) { top: 4%;  left: 4%;  animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 6%;  right: 6%; animation-delay: 1s; }
    .sparkle:nth-child(3) { bottom: 6%; left: 4%;  animation-delay: 2s; }
    .sparkle:nth-child(4) { bottom: 4%; right: 4%; animation-delay: 0.5s; }

    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      50%       { transform: translateY(-14px) rotate(20deg); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="gallery-page">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <span class="sparkle">🌸</span>
    <span class="sparkle">✨</span>
    <span class="sparkle">💫</span>
    <span class="sparkle">🎀</span>




    <!-- Gallery grid — images will be added here -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Images will be populated here once shared -->
    </div>

  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="Memory" />
  </div>

  <script>
    // Image list — your photos go here
    const images = [
      "photo1.jpeg",
      "photo2.jpeg",
      "photo3.jpeg",
      "photo4.jpeg",
      "photo5.jpeg",
      "photo6.jpeg",
      "photo7.jpeg",
      "photo8.jpeg",
    ];

    const grid     = document.getElementById("galleryGrid");
    const lightbox = document.getElementById("lightbox");
    const lbImg    = document.getElementById("lightboxImg");
    const lbClose  = document.getElementById("lightboxClose");

    images.forEach((src, i) => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      item.style.animationDelay = `${i * 0.07}s`;

      const img = document.createElement("img");
      img.src = src;
      img.alt = `Memory ${i + 1}`;
      img.loading = "lazy";

      item.appendChild(img);
      item.addEventListener("click", () => {
        lbImg.src = src;
        lightbox.classList.add("active");
      });

      grid.appendChild(item);
    });

    // Close lightbox
    lbClose.addEventListener("click", () => lightbox.classList.remove("active"));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.classList.remove("active");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") lightbox.classList.remove("active");
    });
  </script>

  <div style="text-align:center; padding: 40px 20px 60px;">
    <a href="video2.html" id="exitBtn" style="
      display: inline-block;
      padding: 14px 48px;
      background: linear-gradient(135deg, #93C572, #b8dea0);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: 2px solid #7ab55a;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(100, 180, 80, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    "
    onmouseover="this.style.transform='scale(1.05)';this.style.boxShadow='0 8px 28px rgba(100,180,80,0.45)'"
    onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 4px 18px rgba(100,180,80,0.3)'">
      Exit
    </a>
  </div>
</body>
</html>
